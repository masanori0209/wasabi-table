name: Deploy Demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Private リポジトリ + GitHub Free では Pages が使えない（Public 化または Pro 以上が必要）
  check-pages:
    if: github.repository == 'masanori0209/wasabi-table'
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.check.outputs.can_deploy }}
    steps:
      - id: check
        run: |
          if [ "${{ github.event.repository.private }}" = "true" ]; then
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
            echo "::notice::GitHub Pages は Private リポジトリでは現在のプランでは利用できません。Public 化または GitHub Pro で有効化できます。"
          else
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: check-pages
    if: needs.check-pages.outputs.can_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked --quiet

      - name: Install dependencies and build
        run: npm ci && npm run build

      - name: Prepare site
        run: |
          mkdir -p site/dist site/pkg site/examples/npm-package
          cp -r dist/* site/dist/
          cp -r pkg/* site/pkg/
          cp -r examples/npm-package/* site/examples/npm-package/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deployment
        uses: actions/deploy-pages@v4
