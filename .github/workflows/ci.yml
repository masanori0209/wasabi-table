name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install wasm-pack
        run: |
          cargo install wasm-pack --version 0.13.1 --locked --quiet
          wasm-pack --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Install matching ChromeDriver for wasm-pack
        run: |
          CHROME_BIN="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          CHROME_VERSION="$("$CHROME_BIN" --version | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+')"
          DRIVER_PATH="$(npx @puppeteer/browsers install "chromedriver@${CHROME_VERSION}" --path /tmp/wasabi-browsers --format '{{path}}')"
          echo "$(dirname "$DRIVER_PATH")" >> "$GITHUB_PATH"

      - name: Run all tests
        run: npm run test:all

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
