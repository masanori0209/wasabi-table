<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NinjaTable Canvas Resize Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f5f5;
            color: #333;
            padding: 20px;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .demo-container {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-weight: bold;
            font-size: 12px;
        }

        .control-group input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            width: 100px;
        }

        button {
            padding: 10px 15px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #5a67d8;
        }

        .resizable-container {
            border: 2px solid #667eea;
            border-radius: 8px;
            resize: both;
            overflow: hidden;
            width: 800px;
            height: 400px;
            min-width: 300px;
            min-height: 200px;
            position: relative;
        }

        .resize-handle {
            position: absolute;
            bottom: 0;
            right: 0;
            width: 20px;
            height: 20px;
            background: #667eea;
            cursor: nw-resize;
            border-radius: 8px 0 8px 0;
        }

        .resize-handle::after {
            content: '↘';
            position: absolute;
            bottom: 2px;
            right: 2px;
            color: white;
            font-size: 12px;
        }

        #myCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }

        .stats {
            margin-top: 10px;
            padding: 10px;
            background: #f8f9fa;
            border-radius: 6px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 12px;
        }

        .info-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .info-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .info-box h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .info-box ul {
            list-style-type: none;
            padding-left: 0;
        }

        .info-box li {
            margin-bottom: 5px;
            padding-left: 15px;
            position: relative;
        }

        .info-box li::before {
            content: '✓';
            position: absolute;
            left: 0;
            color: #28a745;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🔧 NinjaTable Canvas Resize Demo</h1>
        <p>Canvasのリサイズ機能をテストするデモページです</p>
    </div>

    <div class="demo-container">
        <h2>📐 Canvas リサイズテスト</h2>
        
        <div class="controls">
            <div class="control-group">
                <label>幅 (px)</label>
                <input type="number" id="widthInput" value="800" min="300" max="1200">
            </div>
            <div class="control-group">
                <label>高さ (px)</label>
                <input type="number" id="heightInput" value="400" min="200" max="800">
            </div>
            <button onclick="resizeCanvas()">手動リサイズ</button>
            <button onclick="fitToWindow()">ウィンドウに合わせる</button>
            <button onclick="resetSize()">デフォルトサイズ</button>
        </div>

        <div class="resizable-container" id="canvasContainer">
            <canvas id="myCanvas"></canvas>
            <div class="resize-handle"></div>
        </div>

        <div class="stats" id="stats">
            統計情報を読み込み中...
        </div>
    </div>

    <div class="info-panel">
        <div class="info-box">
            <h3>🎯 テスト項目</h3>
            <ul>
                <li>手動でのサイズ変更</li>
                <li>親要素のリサイズ（ドラッグで調整）</li>
                <li>ウィンドウリサイズ対応</li>
                <li>スクロールバーの自動調整</li>
                <li>セル描画の自動更新</li>
            </ul>
        </div>
        <div class="info-box">
            <h3>🔧 使用方法</h3>
            <ul>
                <li>右下の角をドラッグしてコンテナをリサイズ</li>
                <li>数値入力で正確なサイズに調整</li>
                <li>ウィンドウサイズを変更してテスト</li>
                <li>セルをクリックして選択状態を確認</li>
                <li>スクロールして描画範囲を確認</li>
            </ul>
        </div>
    </div>

    <script type="module">
        import init, { NinjaTable as WasmNinjaTable } from '../pkg/ninja_table.js';
        import { NinjaTable } from '../dist/index.js';

        let table = null;
        const statsElement = document.getElementById('stats');
        const canvasContainer = document.getElementById('canvasContainer');

        // テーブル設定
        const config = {
            row_count: 30,
            col_count: 15,
            default_col_width: 100,
            default_row_height: 28,
            header_height: 32,
            row_header_width: 50,
            font_family: 'Arial, sans-serif',
            font_size: 12,
            background_color: '#ffffff',
            text_color: '#333333',
            grid_color: '#e0e0e0',
            header_background_color: '#f8f9fa',
            selected_cell_color: '#667eea',
            show_grid: true,
            column_headers: []
        };

        // 統計情報を更新
        function updateStats() {
            if (table) {
                try {
                    const stats = table.getStats();
                    const canvas = document.getElementById('myCanvas');
                    statsElement.innerHTML = `
                        <strong>Canvas:</strong> ${canvas.width}×${canvas.height}px |
                        <strong>Container:</strong> ${canvasContainer.offsetWidth}×${canvasContainer.offsetHeight}px |
                        <strong>表示セル:</strong> ${stats.visibleCells} |
                        <strong>スクロール:</strong> (${Math.round(stats.scrollX)}, ${Math.round(stats.scrollY)})
                    `;
                } catch (error) {
                    console.error('Stats error:', error);
                    statsElement.textContent = '統計情報の取得に失敗しました';
                }
            }
        }

        // テーブル初期化
        async function initTable() {
            try {
                await init();
                
                const canvas = document.getElementById('myCanvas');
                table = await NinjaTable.create(canvas, config);
                
                // イベントハンドラーを設定
                table.setEventHandlers({
                    onCellSelect: (position) => {
                        updateStats();
                    }
                });

                // サンプルデータを設定
                const sampleData = [];
                for (let row = 0; row < 15; row++) {
                    for (let col = 0; col < 10; col++) {
                        sampleData.push({
                            row: row,
                            col: col,
                            value: `R${row}C${col}`
                        });
                    }
                }
                table.setBatchData(sampleData);
                
                table.render();
                updateStats();
                
                console.log('✅ NinjaTable initialized successfully!');
            } catch (error) {
                console.error('❌ Initialization error:', error);
                statsElement.textContent = `初期化エラー: ${error.message}`;
            }
        }

        // グローバル関数
        window.resizeCanvas = () => {
            const width = parseInt(document.getElementById('widthInput').value);
            const height = parseInt(document.getElementById('heightInput').value);
            
            canvasContainer.style.width = `${width}px`;
            canvasContainer.style.height = `${height}px`;
            
            if (table) {
                // 新しいリサイズ機能を使用
                table.updateCanvasSize();
                updateStats();
            }
        };

        window.fitToWindow = () => {
            const width = Math.min(window.innerWidth - 100, 1200);
            const height = Math.min(window.innerHeight - 300, 600);
            
            document.getElementById('widthInput').value = width;
            document.getElementById('heightInput').value = height;
            
            canvasContainer.style.width = `${width}px`;
            canvasContainer.style.height = `${height}px`;
            
            if (table) {
                table.updateCanvasSize();
                updateStats();
            }
        };

        window.resetSize = () => {
            document.getElementById('widthInput').value = 800;
            document.getElementById('heightInput').value = 400;
            
            canvasContainer.style.width = '800px';
            canvasContainer.style.height = '400px';
            
            if (table) {
                table.updateCanvasSize();
                updateStats();
            }
        };

        // ウィンドウリサイズイベント
        window.addEventListener('resize', () => {
            if (table) {
                // ResizeObserverが自動的に処理するが、統計情報を更新
                setTimeout(updateStats, 100);
            }
        });

        // ResizeObserverでコンテナのリサイズを監視
        const resizeObserver = new ResizeObserver((entries) => {
            for (const entry of entries) {
                if (entry.target === canvasContainer && table) {
                    const { width, height } = entry.contentRect;
                    document.getElementById('widthInput').value = Math.round(width);
                    document.getElementById('heightInput').value = Math.round(height);
                    
                    // NinjaTableの自動リサイズ機能が動作
                    setTimeout(updateStats, 50);
                }
            }
        });
        resizeObserver.observe(canvasContainer);

        // 初期化
        initTable();
    </script>
</body>
</html>
