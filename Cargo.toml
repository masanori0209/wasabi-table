[package]
name = "wasabi-table"
version = "1.0.7"
edition = "2021"
description = "High-performance Excel-like table component for the web"
license = "MIT"
repository = "https://github.com/masanori0209/wasabi-table"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Os"]

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = { version = "0.2.100", features = ["serde-serialize"] }
web-sys = { version = "0.3.77", features = [
    "console",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "Window",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "DomRect",
    "HtmlInputElement",
    "EventTarget",
    "Event",
    "FocusEvent",
    "ResizeObserver",
    "ResizeObserverEntry",
    "DomRectReadOnly",
    "CssStyleDeclaration"
] }
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"
regex = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.50"
