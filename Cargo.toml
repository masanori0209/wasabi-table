[package]
name = "ninja-table"
version = "0.1.0"
edition = "2021"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "console",
    "CanvasRenderingContext2d",
    "HtmlCanvasElement",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "FocusEvent",
    "EventTarget",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "Document",
    "Window",
    "DomRect",
    "CssStyleDeclaration",
    "Node",
]}
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"
regex = "1.0"

[dev-dependencies]
wasm-bindgen-test = "0.3.42"